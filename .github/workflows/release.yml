name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "发布到 GitHub Release（默认不发布）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: webai-proxy

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test

  build:
    name: Build (${{ matrix.asset_name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: webai-proxy
            asset_name: webai-proxy-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: webai-proxy.exe
            asset_name: webai-proxy-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: webai-proxy
            asset_name: webai-proxy-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: webai-proxy
            asset_name: webai-proxy-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: webai-proxy/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  package-chrome-extension:
    name: Package Chrome Extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome extension
        run: |
          cd chrome-extension
          zip -r ../../webai-proxy-chrome-extension.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webai-proxy-chrome-extension
          path: webai-proxy-chrome-extension.zip
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, package-chrome-extension]
    if: github.event_name == 'workflow_dispatch' && fromJSON(inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release assets
        run: ls -lh dist/
      - name: Generate release notes
        run: |
          echo "## webai-proxy ${{ github.ref_name }}" > release-body.md
          echo "" >> release-body.md
          echo "See [USAGE.md](./USAGE.md) for setup instructions." >> release-body.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: "true"
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
